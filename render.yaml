services:
  - type: web
    name: transport-tms
    runtime: node
    plan: free
    # build regenerates the Prisma client; start applies pending migrations
    # before serving. migrate:prod (prisma migrate deploy) is idempotent, so
    # running it on every boot is safe and costs nothing when up to date.
    # Without it a newly added table exists in the schema but not in the
    # database, and the first query against it fails with a server-side
    # exception.
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: DATABASE_URL
        sync: false # paste your Neon pooled connection string in the dashboard
      - key: DIRECT_DATABASE_URL
        sync: false # paste your Neon direct (non-pooled) connection string
      - key: AUTH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads # NOTE: free tier has no persistent disk — uploads are lost on redeploy
      - key: NEXT_PUBLIC_APP_NAME
        value: TransportTMS
